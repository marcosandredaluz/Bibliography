[tool.poetry]
name = "bibliography-engine"
version = "1.0.0"
description = "Motor de Gestão Bibliográfica Forense, Anti-Alucinação e Integração com Processadores de Texto (.DOCX)"
authors = ["Marcos André da Luz <https://www.linkedin.com/in/marcos-andre-da-luz-847039141>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/marcosandredaluz/Bibliography"
keywords = ["bibliography", "citation-auditing", "anti-hallucination", "prisma-2020", "csl", "open-science", "docx-integration"]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pluggy = "^1.5.0"
requests = "^2.32.0"
beautifulsoup4 = "^4.12.0"
numpy = "^2.0.0"
pypdf = "^5.0.0"
pydantic = "^2.9.0"
python-Levenshtein = {version = "^0.26.0", optional = true}
sentence-transformers = {version = "^3.2.0", optional = true}

[tool.poetry.extras]
ai-heavy = ["sentence-transformers", "python-Levenshtein"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
ruff = "^0.7.0"
black = "^24.10.0"
mypy = "^1.13.0"
bandit = "^1.7.10"
commitizen = "^3.29.0"

[tool.poetry.scripts]
bibliografia-server = "app.main:app"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# --- Configurações de Qualidade de Código & Linting ---

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | dist
  | build
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", ".venv", "dist", "build"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle erros
    "W",   # pycodestyle avisos
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["dist", "build", "tests"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=app"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.2.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
    "backend/app/main.py:version"
]
