name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-format:
    name: Lint & Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Linters (Ruff & Black)
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Executar Ruff Linter
        run: ruff check backend/

      - name: Verificar Formatação com Black
        run: black --check backend/

  security-sast:
    name: Análise de Segurança Estática (SAST & Secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Bandit
        run: pip install bandit

      - name: Executar Bandit (Verificação de Vulnerabilidades no Código)
        run: bandit -r backend/app -ll -ii

      - name: Varredura de Chaves e Credenciais Expostas (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  tests:
    name: Testes Automatizados (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Dependências do Backend
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pluggy requests beautifulsoup4 numpy pypdf pydantic pytest pytest-cov

      - name: Executar Bateria de Testes
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
          pytest backend/tests/ -v

  docker-build:
    name: Build & Validação do Container Docker
    runs-on: ubuntu-latest
    needs: [lint-and-format, security-sast, tests]
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da Imagem Docker Multi-Stage (Backend)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: bibliografia-backend:test
