site_name: Bibliografia Forense - Documentação Oficial
site_description: Motor de Gestão Bibliográfica, Auditoria de Citações e Plugins com Pluggy
site_author: Comunidade Bibliografia Forense
repo_url: https://github.com/bibliografia-forense/bibliografia
repo_name: bibliografia-forense/bibliografia
copyright: "Copyright &copy; 2026 Comunidade Bibliografia Forense (Apache 2.0)"

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Início: index.md
  - Arquitetura & Clean Code: arquitetura.md
  - Desenvolvimento de Plugins: plugins.md
  - Extratores Regionais: extratores.md
  - Motor de Auditoria Forense: auditoria.md
  - Integração com Microsoft Word: integracao-word.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
