<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; script-src 'self' 'unsafe-inline' app:; style-src 'self' 'unsafe-inline' app:; img-src 'self' data: blob: app:; worker-src 'self' blob: app:; connect-src 'self' app: ws://localhost:5173 http://localhost:5173" />
    <title>Bibliografia</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #0f172a;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      #splash-screen {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 50% 38%, #1e293b 0%, #0b1120 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      }
      #splash-screen.splash-oculto {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        animation: splash-surgir 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes splash-surgir {
        from {
          opacity: 0;
          transform: scale(0.92) translateY(12px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      .logo-dinamica-wrap {
        position: relative;
        width: 110px;
        height: 110px;
        margin-bottom: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo-glow {
        position: absolute;
        inset: -12px;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.35) 0%, rgba(99, 102, 241, 0.15) 50%, transparent 75%);
        border-radius: 50%;
        animation: glow-pulse 3s ease-in-out infinite alternate;
        filter: blur(12px);
      }
      @keyframes glow-pulse {
        0% {
          transform: scale(0.85);
          opacity: 0.5;
        }
        100% {
          transform: scale(1.2);
          opacity: 0.9;
        }
      }
      .logo-anel-orbita {
        position: absolute;
        inset: -6px;
        border: 2px dashed rgba(56, 189, 248, 0.35);
        border-radius: 50%;
        animation: spin-anel 14s linear infinite;
      }
      @keyframes spin-anel {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .logo-svg {
        position: relative;
        z-index: 2;
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.5));
        animation: logo-flutuar 3.5s ease-in-out infinite alternate;
      }
      @keyframes logo-flutuar {
        0% { transform: translateY(0) scale(1); }
        100% { transform: translateY(-6px) scale(1.03); }
      }
      .splash-titulo {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 5px;
        margin: 0;
        background: linear-gradient(135deg, #ffffff 0%, #bae6fd 50%, #818cf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-transform: uppercase;
      }
      .splash-subtitulo {
        font-size: 13px;
        font-weight: 500;
        color: #94a3b8;
        letter-spacing: 1.5px;
        margin-top: 6px;
        text-transform: uppercase;
      }
      .splash-barra-progresso {
        width: 220px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 99px;
        overflow: hidden;
        margin-top: 26px;
        position: relative;
      }
      .splash-linha-ativa {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 45%;
        background: linear-gradient(90deg, #38bdf8, #818cf8);
        border-radius: 99px;
        animation: barra-correr 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
      }
      @keyframes barra-correr {
        0% {
          left: -45%;
          width: 45%;
        }
        50% {
          width: 60%;
        }
        100% {
          left: 100%;
          width: 45%;
        }
      }
      .splash-status {
        margin-top: 12px;
        font-size: 12px;
        color: #64748b;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen Animada com Logo Dinâmica -->
    <div id="splash-screen">
      <div class="splash-container">
        <div class="logo-dinamica-wrap">
          <div class="logo-glow"></div>
          <div class="logo-anel-orbita"></div>
          <svg class="logo-svg" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="grad-capa" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0284c7" />
                <stop offset="100%" stop-color="#4f46e5" />
              </linearGradient>
              <linearGradient id="grad-pag-esq" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f8fafc" />
                <stop offset="100%" stop-color="#cbd5e1" />
              </linearGradient>
              <linearGradient id="grad-pag-dir" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="100%" stop-color="#e2e8f0" />
              </linearGradient>
              <linearGradient id="grad-destaque" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8" />
                <stop offset="100%" stop-color="#818cf8" />
              </linearGradient>
            </defs>

            <!-- Capa externa do livro -->
            <path d="M48 24C37 17 21 17 12 21V72C21 68 37 68 48 75C59 68 75 68 84 72V21C75 17 59 17 48 24Z" fill="url(#grad-capa)" />

            <!-- Páginas abertas (esquerda e direita) com relevo e sombra -->
            <path d="M48 24C37 17 22 17 14 20V69C22 66 37 66 48 73V24Z" fill="url(#grad-pag-esq)" />
            <path d="M48 24C59 17 74 17 82 20V69C74 66 59 66 48 73V24Z" fill="url(#grad-pag-dir)" />

            <!-- Lombada central iluminada -->
            <line x1="48" y1="23" x2="48" y2="74" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />

            <!-- Linhas de texto estilizadas (Páginas esquerdas) -->
            <line x1="22" y1="32" x2="40" y2="35" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" />
            <line x1="22" y1="41" x2="38" y2="44" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" />
            <line x1="22" y1="50" x2="41" y2="53" stroke="url(#grad-destaque)" stroke-width="2.6" stroke-linecap="round" />
            <line x1="22" y1="59" x2="36" y2="62" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" />

            <!-- Linhas de texto estilizadas (Páginas direitas) -->
            <line x1="56" y1="35" x2="74" y2="32" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" />
            <line x1="58" y1="44" x2="74" y2="41" stroke="url(#grad-destaque)" stroke-width="2.6" stroke-linecap="round" />
            <line x1="55" y1="53" x2="74" y2="50" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" />
            <line x1="60" y1="62" x2="74" y2="59" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" />

            <!-- Estrela / Marcador brilhante no topo -->
            <circle cx="48" cy="16" r="3.5" fill="#38bdf8" />
            <circle cx="48" cy="16" r="6" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
          </svg>
        </div>

        <h1 class="splash-titulo">Bibliografia</h1>
        <div class="splash-subtitulo">Gerenciador Científico &amp; Citações CSL</div>

        <div class="splash-barra-progresso">
          <div class="splash-linha-ativa"></div>
        </div>
        <div class="splash-status" id="splash-status">Iniciando biblioteca sincronizada…</div>
      </div>
    </div>

    <div id="root"></div>
    <script>
      // Fallback de segurança: assegura que o splash nunca trave a tela se houver demora de rede ou inicialização
      window.__removerSplash = function() {
        var s = document.getElementById('splash-screen');
        if (s && !s.classList.contains('splash-oculto')) {
          s.classList.add('splash-oculto');
          setTimeout(function() {
            try { s.remove(); } catch(e) {}
          }, 450);
        }
      };
      setTimeout(function() {
        window.__removerSplash();
      }, 2500);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
