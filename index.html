<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; script-src 'self' app:; style-src 'self' 'unsafe-inline' app:; img-src 'self' data: blob: app:; worker-src 'self' blob: app:; connect-src 'self' app: ws://localhost:5173 http://localhost:5173" />
    <title>Bibliografia</title>
    <link rel="stylesheet" href="/src/splash.css" />
  </head>
  <body>
    <!-- Splash Screen Animada com Logo Dinâmica -->
    <div id="splash-screen">
      <div class="splash-container">
        <div class="logo-dinamica-wrap">
          <div class="logo-glow"></div>
          <div class="logo-anel-orbita"></div>
          <svg class="logo-svg" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="grad-capa" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0284c7" />
                <stop offset="100%" stop-color="#4f46e5" />
              </linearGradient>
              <linearGradient id="grad-pag-esq" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f8fafc" />
                <stop offset="100%" stop-color="#cbd5e1" />
              </linearGradient>
              <linearGradient id="grad-pag-dir" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="100%" stop-color="#e2e8f0" />
              </linearGradient>
              <linearGradient id="grad-destaque" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8" />
                <stop offset="100%" stop-color="#818cf8" />
              </linearGradient>
            </defs>

            <!-- Capa externa do livro -->
            <path d="M48 24C37 17 21 17 12 21V72C21 68 37 68 48 75C59 68 75 68 84 72V21C75 17 59 17 48 24Z" fill="url(#grad-capa)" />

            <!-- Páginas abertas (esquerda e direita) com relevo e sombra -->
            <path d="M48 24C37 17 22 17 14 20V69C22 66 37 66 48 73V24Z" fill="url(#grad-pag-esq)" />
            <path d="M48 24C59 17 74 17 82 20V69C74 66 59 66 48 73V24Z" fill="url(#grad-pag-dir)" />

            <!-- Lombada central iluminada -->
            <line x1="48" y1="23" x2="48" y2="74" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />

            <!-- Linhas de texto estilizadas (Páginas esquerdas) -->
            <line x1="22" y1="32" x2="40" y2="35" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" />
            <line x1="22" y1="41" x2="38" y2="44" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" />
            <line x1="22" y1="50" x2="41" y2="53" stroke="url(#grad-destaque)" stroke-width="2.6" stroke-linecap="round" />
            <line x1="22" y1="59" x2="36" y2="62" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" />

            <!-- Linhas de texto estilizadas (Páginas direitas) -->
            <line x1="56" y1="35" x2="74" y2="32" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" />
            <line x1="58" y1="44" x2="74" y2="41" stroke="url(#grad-destaque)" stroke-width="2.6" stroke-linecap="round" />
            <line x1="55" y1="53" x2="74" y2="50" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" />
            <line x1="60" y1="62" x2="74" y2="59" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" />

            <!-- Estrela / Marcador brilhante no topo -->
            <circle cx="48" cy="16" r="3.5" fill="#38bdf8" />
            <circle cx="48" cy="16" r="6" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
          </svg>
        </div>

        <h1 class="splash-titulo">Bibliografia</h1>
        <div class="splash-subtitulo">Gerenciador Científico &amp; Citações CSL</div>

        <div class="splash-barra-progresso">
          <div class="splash-linha-ativa"></div>
        </div>
        <div class="splash-status" id="splash-status">Iniciando biblioteca sincronizada…</div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
